name: Build and deploy to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prevent older runs from overwriting newer latest tags.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ github.event_name == 'workflow_dispatch' && '["front","admin","back"]' || steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            front:
              - 'apps/front/**'
              - 'docker/front.Dockerfile'
              - 'libs/**'
              - &shared '.github/workflows/**'
              - &ignore '.dockerignore'
              - &config '.pnpmrc'
              - &root 'package.json'
              - &lock 'pnpm-lock.yaml'
              - &workspace 'pnpm-workspace.yaml'
              - &tsconfig 'tsconfig.json'
              - &manifests 'apps/*/package.json'
            admin:
              - 'apps/admin/**'
              - 'docker/admin.Dockerfile'
              - 'libs/**'
              - *shared
              - *ignore
              - *config
              - *root
              - *lock
              - *workspace
              - *tsconfig
              - *manifests
            back:
              - 'apps/back/**'
              - 'docker/back.Dockerfile'
              - 'libs/shared-types/**'
              - 'libs/*/package.json'
              - *shared
              - *ignore
              - *config
              - *root
              - *lock
              - *workspace
              - *tsconfig
              - *manifests

  build:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create Next build environment
        if: matrix.app != 'back'
        env:
          APP: ${{ matrix.app }}
          NEXT_API_URL: ${{ secrets.NEXT_API_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FRONT_URL: ${{ secrets.FRONT_URL }}
          NEXT_PUBLIC_FRONT_URL: ${{ secrets.NEXT_PUBLIC_FRONT_URL }}
        run: |
          {
            printf 'NEXT_API_URL=%s\n' "$NEXT_API_URL"
            printf 'NEXT_PUBLIC_API_URL=%s\n' "$NEXT_PUBLIC_API_URL"
            printf 'FRONT_URL=%s\n' "$FRONT_URL"
            printf 'NEXT_PUBLIC_FRONT_URL=%s\n' "$NEXT_PUBLIC_FRONT_URL"
          } > "apps/$APP/.env.production"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/portfolio-${{ matrix.app }}:latest
            ${{ secrets.DOCKER_USER }}/portfolio-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=portfolio-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=portfolio-${{ matrix.app }}

  deploy:
    needs: [changes, build]
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy built images to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        env:
          FRONT_CHANGED: ${{ contains(fromJSON(needs.changes.outputs.apps), 'front') }}
          ADMIN_CHANGED: ${{ contains(fromJSON(needs.changes.outputs.apps), 'admin') }}
          BACK_CHANGED: ${{ contains(fromJSON(needs.changes.outputs.apps), 'back') }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: FRONT_CHANGED,ADMIN_CHANGED,BACK_CHANGED
          command_timeout: 25m
          script: |
            set -eu
            cd ~/portfolio-deploy
            docker compose config --quiet

            pull_with_retry() {
              attempt=1
              until docker compose pull "$1"; do
                if [ "$attempt" -ge 3 ]; then
                  return 1
                fi
                attempt=$((attempt + 1))
                sleep 15
              done
            }

            # Pull every changed image before replacing any running service.
            set --
            if [ "$FRONT_CHANGED" = "true" ]; then set -- "$@" front; fi
            if [ "$ADMIN_CHANGED" = "true" ]; then set -- "$@" admin; fi
            if [ "$BACK_CHANGED" = "true" ]; then set -- "$@" back; fi
            if [ "$#" -eq 0 ]; then exit 0; fi
            for service in "$@"; do
              pull_with_retry "$service"
            done

            # Leave PostgreSQL and Redis running with their existing volumes.
            docker compose up -d --no-deps --no-build --wait --wait-timeout 120 "$@"
            docker compose exec -T nginx nginx -t
            docker compose restart nginx
            docker compose ps
